<svg fill="none" viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-opacity: 0.18; stroke-width: 1; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 40px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 17px; fill: #94a3b8; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #38bdf8; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 11px; fill: #94a3b8; }

    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }

    .pulsing-orb { transform-origin: center; animation: pulseGlow 6s ease-in-out infinite; }
    .floating-pill-1 { animation: floatPill1 4s ease-in-out infinite; }
    .floating-pill-2 { animation: floatPill2 5s ease-in-out infinite; }
    .rotating-ring { transform-origin: 1040px 180px; animation: rotateRing 20s linear infinite; }
    .flow-line { stroke-dasharray: 6 6; animation: dashMove 3s linear infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" stroke="#334155" stroke-width="1.5"/>

  <!-- Geometric Circuit & Grid Lines (Background Dynamic Layer) -->
  <g opacity="0.6">
    <line x1="0" y1="90" x2="1200" y2="90" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="270" x2="1200" y2="270" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="360" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="360" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="360" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="360" class="grid-line" />
  </g>

  <!-- Animated Glowing Background Orbs (Placed away from text center) -->
  <circle cx="1040" cy="180" r="130" fill="#6366f1" class="pulsing-orb" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="920" cy="90" r="80" fill="#38bdf8" class="pulsing-orb" opacity="0.2" filter="url(#softGlow)" />
  <circle cx="150" cy="60" r="100" fill="#a855f7" class="pulsing-orb" opacity="0.15" filter="url(#softGlow)" />

  <!-- Animated Dynamic Governance Hologram / Graphic (Right Side) -->
  <g transform="translate(900, 50)">
    <!-- Rotating Ring -->
    <circle cx="140" cy="130" r="105" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="10 14" fill="none" class="rotating-ring"/>
    <circle cx="140" cy="130" r="75" stroke="#475569" stroke-width="1" stroke-opacity="0.4" fill="none"/>

    <!-- Shield / Vault Symbol -->
    <path d="M140 70 L195 95 C195 145 140 185 140 185 C140 185 85 145 85 95 Z" fill="url(#shieldGrad)" stroke="url(#primaryGrad)" stroke-width="2.5" filter="url(#glow)"/>

    <!-- Checkmark inside Shield -->
    <path d="M125 128 L136 139 L156 117" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Flow Connecting Lines -->
    <path d="M0 130 L85 130" stroke="#38bdf8" stroke-width="2" class="flow-line" opacity="0.7"/>
    <circle cx="0" cy="130" r="4" fill="#38bdf8"/>

    <!-- Live Governance Pulse Badge -->
    <g class="floating-pill-1" transform="translate(30, 20)">
      <rect width="130" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.95"/>
      <circle cx="16" cy="16" r="4" fill="#22c55e" filter="url(#glow)"/>
      <text x="28" y="21" class="pill-text" font-size="11" fill="#38bdf8">QUORUM ACTIVE</text>
    </g>

    <!-- Cryptographic Hash Pill -->
    <g class="floating-pill-2" transform="translate(70, 215)">
      <rect width="150" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity="0.95"/>
      <circle cx="16" cy="16" r="4" fill="#818cf8"/>
      <text x="28" y="21" class="pill-text" font-size="11" fill="#c7d2fe">SHA-256 AUDIT READY</text>
    </g>
  </g>

  <!-- Foreground Main Branding & Titles (Guaranteed high-contrast & unobstructed) -->
  <g transform="translate(60, 65)">
    <!-- Category Badge -->
    <g>
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <circle cx="14" cy="14" r="5" fill="#38bdf8"/>
      <text x="26" y="19" class="pill-text" font-size="11" fill="#93c5fd" letter-spacing="0.5">BOARD GOVERNANCE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" class="title">
      Awesome Board Resolution &amp;
    </text>
    <text x="0" y="125" class="title" fill="url(#primaryGrad)">
      Governance Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" class="subtitle">
      Curated directory of SaaS board portals, voting workflows &amp; open-source audit engines
    </text>

    <!-- Feature Feature Tag Badges -->
    <g transform="translate(0, 195)">
      <!-- Tag 1 -->
      <g>
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="pill-text" font-size="12">🏛️ Board Portals</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(155, 0)">
        <rect width="175" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="pill-text" font-size="12">📜 Resolution Workflows</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(340, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="pill-text" font-size="12">⚡ Minute Automation</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(530, 0)">
        <rect width="185" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="pill-text" font-size="12">🔐 Cryptographic Audits</text>
      </g>
    </g>
  </g>
</svg>
